<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="0%" r="60%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="rgba(153,69,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(153,69,255,0)"/>
    </radialGradient>
    <rect id="logo-clip-shape" x="0" y="0" width="56" height="56" rx="12"/>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#08080B"/>

  <!-- Radial gradient ellipse at top center -->
  <ellipse cx="600" cy="0" rx="500" ry="320" fill="url(#bg-glow)"/>

  <!-- Violet rounded square logo bg -->
  <rect x="80" y="90" width="56" height="56" rx="12" fill="#7c3aed"/>

  <!-- White S path centered in the logo square (scaled from the favicon path, centered in 56x56 at 80,90) -->
  <g transform="translate(80,90)">
    <svg width="56" height="56" viewBox="0 0 48 46">
      <path fill="#ffffff" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"/>
    </svg>
  </g>

  <!-- "sable" wordmark -->
  <text x="150" y="126" font-family="Inter, sans-serif" font-size="28" font-weight="600" fill="#ffffff">sable</text>

  <!-- Headline -->
  <text x="80" y="300" font-family="Inter, sans-serif" font-size="64" font-weight="600" fill="#ffffff" letter-spacing="-2">Sable v2 is here.</text>

  <!-- Subline -->
  <text x="80" y="370" font-family="Inter, sans-serif" font-size="40" font-weight="400" fill="#8E8E9A">Migrate your wallet.</text>
</svg>
